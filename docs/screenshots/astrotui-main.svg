<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">astrotui pod list screenshot</title>
  <desc id="desc">Terminal UI showing a Kubernetes pods table, command palette, log panel, and safety guard.</desc>
  <rect width="1200" height="720" fill="#0b1020"/>
  <rect x="28" y="28" width="1144" height="664" rx="6" fill="#101827" stroke="#2d3b52" stroke-width="2"/>
  <text x="52" y="64" fill="#67e8f9" font-family="Menlo, Consolas, monospace" font-size="18">astrotui [kind-kind/default] pods</text>
  <text x="920" y="64" fill="#94a3b8" font-family="Menlo, Consolas, monospace" font-size="15">? help  Ctrl+P palette  / filter</text>
  <line x1="52" y1="88" x2="1148" y2="88" stroke="#2d3b52" stroke-width="1"/>

  <g font-family="Menlo, Consolas, monospace" font-size="15">
    <text x="52" y="122" fill="#e2e8f0">NAMESPACE</text>
