version: 2
project_name: astrotui
before:
  hooks:
    - go mod tidy
builds:
  - id: astrotui
    main: ./cmd/astrotui
    binary: astrotui
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
archives:
  - name_template: "astrotui_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
checksum:
  name_template: checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args: ["sign-blob", "--yes", "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}"]
    artifacts: checksum
dockers:
  - image_templates:
      - ghcr.io/alphabravo-oss/astrotui:{{ .Version }}-amd64
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: amd64
  - image_templates:
      - ghcr.io/alphabravo-oss/astrotui:{{ .Version }}-arm64
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: arm64
docker_manifests:
  - name_template: ghcr.io/alphabravo-oss/astrotui:{{ .Version }}
    image_templates:
      - ghcr.io/alphabravo-oss/astrotui:{{ .Version }}-amd64
      - ghcr.io/alphabravo-oss/astrotui:{{ .Version }}-arm64
