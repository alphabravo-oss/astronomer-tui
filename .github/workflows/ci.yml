name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.2"
      - run: make lint
      - run: make test
      - run: make envtest
      - run: make build
      - run: make perf
      - run: make coverage-nfr
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.2"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.12.7
          install-only: true
      - run: make release-snapshot
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.2"
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: astrotui-ci
      - name: Install Helm 3.21.0
        shell: bash
        run: |
          curl -fsSLo /tmp/helm.tar.gz https://get.helm.sh/helm-v3.21.0-linux-amd64.tar.gz
          curl -fsSLo /tmp/helm.sha256 https://get.helm.sh/helm-v3.21.0-linux-amd64.tar.gz.sha256sum
          (cd /tmp && sed 's/helm-v3.21.0-linux-amd64.tar.gz/helm.tar.gz/' helm.sha256 | sha256sum -c -)
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - run: make e2e
        env:
          ASTROTUI_E2E: "1"
          ASTROTUI_NODE_SHELL_E2E: "1"
          ASTROTUI_E2E_CONTEXT: kind-astrotui-ci
      - run: make nfr-live
        env:
          ASTROTUI_E2E_CONTEXT: kind-astrotui-ci
  terminal-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.2'
      - run: go test -race ./internal/ui/... ./internal/cluster/... ./test/distribution/...
      - run: make build
