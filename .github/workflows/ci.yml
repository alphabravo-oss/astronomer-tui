name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: make lint
      - run: make test
      - run: make envtest
      - run: make build
      - run: make perf
      - run: make coverage-nfr
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          install-only: true
      - run: make release-snapshot
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: helm/kind-action@v1
        with:
          cluster_name: kind
      - run: make e2e
        env:
          ASTROTUI_E2E: "1"
          ASTROTUI_E2E_CONTEXT: kind-kind
      - run: make nfr-live
        env:
          ASTROTUI_E2E_CONTEXT: kind-kind
