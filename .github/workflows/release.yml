name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.2"
      - run: go test -race ./...
      - run: make envtest
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.6.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Export signed container installables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            image="ghcr.io/alphabravo-oss/astrotui:${RELEASE_TAG#v}-${arch}"
            docker pull --platform "linux/${arch}" "$image"
            actual=$(docker image inspect "$image" --format '{{.Architecture}}')
            test "$actual" = "$arch"
            docker save "$image" | gzip -n > "dist/astrotui_container_linux_${arch}.tar.gz"
          done
          (cd dist && sha256sum astrotui_container_linux_*.tar.gz > container-checksums.txt)
          cosign sign-blob --yes \
            --output-signature=dist/container-checksums.txt.sig \
            --output-certificate=dist/container-checksums.txt.pem \
            dist/container-checksums.txt
          gh release upload "$RELEASE_TAG" dist/astrotui_container_linux_*.tar.gz dist/container-checksums.txt*
      - uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          path: dist
          syft-version: v1.28.0
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-release-assets: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/*.tar.gz'
      - name: Check anonymous container pulls
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/astrotui-anonymous-docker
          if ! docker --config /tmp/astrotui-anonymous-docker pull "ghcr.io/alphabravo-oss/astrotui:${RELEASE_TAG#v}"; then
            echo "::warning::GHCR requires authentication. Signed Docker-load archives are available on the release; package visibility must be changed by a package administrator."
          fi
